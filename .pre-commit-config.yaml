repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-xml
      - id: check-yaml
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: local
    hooks:
      # Markdown
      - id: prettier-markdown
        name: prettier markdown
        entry: prettier --write
        language: system
        types: [markdown]

      # Lua
      - id: stylua
        name: stylua
        entry: stylua
        language: system
        types: [lua]

      # Shell
      - id: shfmt
        name: shfmt
        entry: shfmt -w
        language: system
        types: [shell]
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]

      # Javascript
      - id: pnpm-lint
        name: pnpm lint
        entry: pnpm --dir web lint
        language: system
        files: ^web/
        pass_filenames: false

      # Python
      - id: uv-lock
        name: uv lock
        entry: uv lock --check --project backend
        language: system
        files: ^backend/(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: system
        files: ^backend/
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        files: ^backend/
        types: [python]
      - id: pyright
        name: pyright
        entry: pyright --project backend
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false

      # Flutter
      - id: dart-format
        name: dart format
        entry: dart format
        language: system
        types: [dart]
        files: ^mobile/project_name/
      - id: flutter-analyze
        name: flutter analyze
        entry: mise x -- flutter analyze mobile/project_name
        language: system
        files: ^mobile/project_name/
        pass_filenames: false

      # Supabase / postgres
      - id: supabase-db-lint
        name: supabase db lint
        entry: supabase db lint
        language: system
        files: ^supabase/
        types: [sql]
        pass_filenames: false
      - id: sqlfluff-fix
        name: sqlfluff fix
        entry: sqlfluff fix --dialect postgres
        language: system
        files: ^supabase/
        types: [sql]
      - id: sqlfluff-lint
        name: sqlfluff lint
        entry: sqlfluff lint --dialect postgres
        language: system
        files: ^supabase/
        types: [sql]
      - id: forbid-drop-table-in-migrations
        name: forbid drop table in migrations
        entry: bash -c 'if rg -n "DROP TABLE" supabase/migrations; then exit 1; fi'
        language: system
        files: ^supabase/migrations/
        types: [sql]
        pass_filenames: false
      - id: forbid-drop-column-in-migrations
        name: forbid drop column in migrations
        entry: bash -c 'if rg -n "DROP COLUMN" supabase/migrations; then exit 1; fi'
        language: system
        files: ^supabase/migrations/
        types: [sql]
        pass_filenames: false
